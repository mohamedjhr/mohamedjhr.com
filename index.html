<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOHAMED JHR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@1,400&family=Roboto:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0c0e;
      --white: #ffffff;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: #f0f0f0;
      font-family: 'Inter Tight', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Original noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* Original ambient glow blobs */
    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(180,180,200,0.04) 0%, transparent 70%);
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
    }

    .ambient-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(160,160,180,0.03) 0%, transparent 70%);
      bottom: 20%;
      right: -100px;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }

    .hero-headline {
      white-space: nowrap;
      font-size: clamp(52px, 8vw, 108px);
      line-height: 1;
      margin-bottom: 30px;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 1.2s ease-out 0.2s forwards;
    }

    .hero-headline .part-mohamed {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      background: linear-gradient(10deg, #929292 0%, #c8c8d8 35%, #fff 60%, #e0e0ec 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(200,200,230,0.18));
    }

    .hero-headline .part-jhr {
      font-family: 'Libre Baskerville', serif;
      font-style: italic;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: -0.07em;
      font-size: 0.94em;
      background: linear-gradient(-10deg, #929292 0%, #c8c8d8 35%, #ffffff 60%, #e0e0ec 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(200,200,230,0.18));
      margin-left: 0.10em;
    }


    .hero-sub {
      font-family: 'Inter Tight', sans-serif;
      font-size: clamp(15px, 1.6vw, 18px);
      font-weight: 300;
      color: #888;
      max-width: 520px;
      line-height: 1.7;
      margin-bottom: 25px;
      opacity: 0;
      animation: fadeUp 1.2s ease-out 0.4s forwards;
    }

    .about-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #7c7c7c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 6px 14px;
      margin-top: 2px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf6e;
      box-shadow: 0 0 8px rgba(76,175,110,0.6);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .hero-btn {
      display: inline-block;
      font-family: 'Inter Tight', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--white);
      text-decoration: none;
      padding: 9px 20px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 15px;
      background: rgba(255,255,255,0.03);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s, transform 0.25s;
      opacity: 0;
      animation: fadeUp 1.2s ease-out 0.6s forwards;
    }

    .hero-btn:hover {
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 0 30px rgba(200,200,230,0.12), 0 0 60px rgba(200,200,230,0.06);
      background: rgba(255,255,255,0.05);
      transform: translateY(-2px);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(36px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero-headline {
        white-space: nowrap;
        font-size: clamp(28px, 10.5vw, 52px);
      }
    }

    @media (max-width: 360px) {
      .hero-headline {
        font-size: 10vw;
      }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <main>
    <h1 class="hero-headline">
      <span class="part-mohamed">MOHAMED</span><span class="part-jhr"> JHR</span>
    </h1>

    <div class="about-badge hero-sub"><span class="badge-dot"></span>Currently Active</div>

    <a class="hero-btn" href="mailto:contact@mohamedjhr.com">Contact</a>
  </main>
</body>
</html>
